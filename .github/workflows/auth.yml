name: Signup and authentication
on:
  pull_request:
    paths:
      - 'app/auth/**'
      - 'app/_layout.tsx'
      - 'app/(tabs)/account.tsx'
      - 'components/AuthForm.tsx'
      - 'components/SignupConfirmation.tsx'
      - 'components/__tests__/SignupConfirmation.test.tsx'
      - 'lib/auth*.ts'
      - 'lib/signupConfirmation.ts'
      - 'lib/supabase.ts'
      - 'lib/__tests__/AuthForm.test.tsx'
      - 'lib/__tests__/auth*.test.ts'
      - 'lib/__tests__/signupConfirmation.test.ts'
      - 'providers/AuthProvider.tsx'
      - 'package*.json'
      - '.github/workflows/auth.yml'
  push:
    branches: [main]
    paths:
      - 'app/auth/**'
      - 'app/_layout.tsx'
      - 'app/(tabs)/account.tsx'
      - 'components/AuthForm.tsx'
      - 'components/SignupConfirmation.tsx'
      - 'components/__tests__/SignupConfirmation.test.tsx'
      - 'lib/auth*.ts'
      - 'lib/signupConfirmation.ts'
      - 'lib/supabase.ts'
      - 'lib/__tests__/AuthForm.test.tsx'
      - 'lib/__tests__/auth*.test.ts'
      - 'lib/__tests__/signupConfirmation.test.ts'
      - 'providers/AuthProvider.tsx'
      - 'package*.json'
      - '.github/workflows/auth.yml'
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx jest --runInBand --watchAll=false lib/__tests__/AuthForm.test.tsx lib/__tests__/signupConfirmation.test.ts lib/__tests__/authCallback.test.ts lib/__tests__/authStorage.test.ts components/__tests__/SignupConfirmation.test.tsx
      - run: npm run export -- --api ci --auth ci --platform android --output-dir dist/auth-ci
        env:
          CI_API_URL: https://api.example.com
          CI_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          CI_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
